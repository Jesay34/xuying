name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Check public release hygiene
        run: python scripts/check_public_release.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build container
        run: docker build --pull -t xuying-ci .
